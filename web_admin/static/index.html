<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrendRadar 管理台</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
</head>
<body>
  <div id="login-screen" class="login-screen hidden">
    <div class="login-bg" aria-hidden="true">
      <div class="login-grid"></div>
      <div class="login-glow login-glow-a"></div>
      <div class="login-glow login-glow-b"></div>
      <div class="login-radar">
        <span class="ring ring-1"></span>
        <span class="ring ring-2"></span>
        <span class="ring ring-3"></span>
        <span class="sweep"></span>
        <span class="blip blip-1"></span>
        <span class="blip blip-2"></span>
        <span class="blip blip-3"></span>
      </div>
      <div class="login-ticker">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="login-card">
      <div class="login-brand">
        <img src="/logo.svg" alt="TrendRadar" class="brand-logo login-logo" width="46" height="46">
        <div>
          <h1>TrendRadar</h1>
          <p>热点聚合 · Web 管理台</p>
        </div>
      </div>
      <form id="login-form">
        <label for="login-username">用户名</label>
        <input id="login-username" name="username" type="text" placeholder="请输入用户名" autocomplete="username" value="admin" required>
        <label for="login-password">密码</label>
        <input id="login-password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
        <p id="login-error" class="form-error hidden"></p>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">登录</button>
      </form>
    </div>
  </div>

  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div class="brand">
        <img src="/logo.svg" alt="" class="brand-logo" width="34" height="34">
        <div class="brand-text"><strong>TrendRadar</strong><small>管理台</small></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="conn-state"><span id="conn-dot" class="dot"></span><span id="conn-text">已连接</span></div>
        <div class="version" id="app-version"></div>
        <button id="logout-btn" class="btn btn-ghost btn-small">退出登录</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">概览</h1>
          <p id="page-desc"></p>
        </div>
        <div class="topbar-actions" id="page-actions"></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
